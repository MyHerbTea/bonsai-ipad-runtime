name: Build111 TestKit-only checks

on:
  push:
    branches:
      - codex/build111-restart-handoff-ui
  pull_request:
    branches:
      - codex/build111-quick-validated
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: TestKit regression tests (no IPA build)
        run: python -m unittest discover -s tools/tests -p 'test_b16_*.py' -v
