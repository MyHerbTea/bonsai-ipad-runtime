name: Bonsai iPad M5-NAX-PQ2-01 Candidate

on:
  push:
    branches:
      - lab/m5-nax-pq2-01
  workflow_dispatch:

concurrency:
  group: bonsai-m5-nax-pq2-01-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  candidate:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Candidate contract tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/rc126_build113_patch_prism_m5_nax_pq2.py
          python3 tools/rc126_build113_m5_nax_pq2_contract_tests.py

      - name: Build exact Prism baseline plus Build83-89 inherited patches
        shell: bash
        run: |
          set -euo pipefail
          PRISM_DIR="/tmp/prism-build113-m5-nax-pq2"
          rm -rf "$PRISM_DIR" Vendor/llama.xcframework
          git clone --filter=blob:none https://github.com/PrismML-Eng/llama.cpp.git "$PRISM_DIR"
          git -C "$PRISM_DIR" checkout adfffbe41b2cabcd51fff326ab045662265062bb

          python3 "$GITHUB_WORKSPACE/tools/rc126_build83_patch_prism_kv_sharding.py" "$PRISM_DIR/src/llama-kv-cache.cpp"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build84_patch_prism_native_trace.py" "$PRISM_DIR/src/llama-kv-cache.cpp" "$PRISM_DIR/src/llama-context.cpp"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build85_patch_prism_scheduler_trace.py" "$PRISM_DIR/src/llama-context.cpp"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build86_patch_prism_crash_forensics.py" "$PRISM_DIR/src/llama-context.cpp" "$PRISM_DIR/ggml/src/ggml-backend.cpp"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build87_patch_prism_sched_context.py" "$PRISM_DIR/ggml/src/ggml-backend.cpp"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build88_patch_prism_mmap_recovery.py" "$PRISM_DIR/ggml/src/ggml-backend.cpp" "$PRISM_DIR/src/llama-context.cpp"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build89_patch_prism_compact_scheduler.py" "$PRISM_DIR/ggml/src/ggml-backend.cpp"

          python3 "$GITHUB_WORKSPACE/tools/rc126_build113_patch_prism_m5_nax_pq2.py" "$PRISM_DIR"

          git -C "$PRISM_DIR" diff --check
          grep -q "BONSAI_M5_NAX_PQ2_01" "$PRISM_DIR/ggml/src/ggml-metal/kernels/mul_mm.metal"
          grep -q "kernel_mul_mm_nax_pq2_0_f32" "$PRISM_DIR/ggml/src/ggml-metal/kernels/mul_mm.metal"
          grep -q "ggml_metal_library_get_pipeline_mul_mm_nax_pq2" "$PRISM_DIR/ggml/src/ggml-metal/ggml-metal-device.cpp"
          grep -q "use_pq2_nax" "$PRISM_DIR/ggml/src/ggml-metal/ggml-metal-ops.cpp"

          (
            cd "$PRISM_DIR"
            bash ./build-xcframework.sh ios-device
          )

          test -f "$PRISM_DIR/build-apple/llama.xcframework/ios-arm64/llama.framework/llama"
          mkdir -p Vendor
          ditto "$PRISM_DIR/build-apple/llama.xcframework" Vendor/llama.xcframework
          test -f Vendor/llama.xcframework/ios-arm64/llama.framework/llama

      - name: Generate and build Bonsai app
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          test -d BonsaiLab.xcodeproj

          for f in BonsaiLab/*.swift; do
            xcrun swiftc -frontend -parse "$f"
          done

          xcodebuild \
            -project BonsaiLab.xcodeproj \
            -scheme BonsaiLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build | tee build/m5_nax_pq2_build.log

      - name: Verify candidate binary and package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/DerivedData/Build/Products/Release-iphoneos/BonsaiLab.app"
          FRAMEWORK="$APP/Frameworks/llama.framework/llama"
          test -f "$APP/BonsaiLab"
          test -f "$FRAMEWORK"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Info.plist")" = "1.0.0"
          test "$(plutil -extract CFBundleVersion raw -o - "$APP/Info.plist")" = "112"

          strings "$FRAMEWORK" | grep -q "kernel_mul_mm_nax_pq2_0_f32"

          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          ditto "$APP" build/ipa/Payload/BonsaiLab.app
          cat > build/M5_NAX_PQ2_01_INFO.txt <<'INFO'
Bonsai iPad M5-NAX-PQ2-01 Candidate
NOT DEVICE CERTIFIED
Product baseline: Build112
Prism base: adfffbe41b2cabcd51fff326ab045662265062bb
Inherited Prism patches: Build83 through Build89
Experimental path: PQ2_0 x F32 large prefill
Kernel: kernel_mul_mm_nax_pq2_0_f32
Tile: 64x128 output, 2x4 simdgroups, 256 threads
K working set: 128
No UI/API/KV/Vision changes
Performance result: NOT MEASURED BY CI
Real M5 iPad correctness/performance validation remains required
INFO
          (cd build/ipa && zip -qry "../BonsaiLab-M5-NAX-PQ2-01-unsigned.ipa" Payload)
          shasum -a 256 build/BonsaiLab-M5-NAX-PQ2-01-unsigned.ipa > build/BonsaiLab-M5-NAX-PQ2-01-unsigned.ipa.sha256

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BonsaiLab-M5-NAX-PQ2-01
          path: |
            build/BonsaiLab-M5-NAX-PQ2-01-unsigned.ipa
            build/BonsaiLab-M5-NAX-PQ2-01-unsigned.ipa.sha256
            build/M5_NAX_PQ2_01_INFO.txt
            build/m5_nax_pq2_build.log
