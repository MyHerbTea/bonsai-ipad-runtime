name: Bonsai Build129-derived Prefill Diagnostics

on:
  push:
    branches: [codex/build129-reasoning-mode, codex/build129-prefill-diagnostics]
  workflow_dispatch:

concurrency:
  group: bonsai-ptq1-tournament-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  BUILD_NUMBER: "129"
  PRISM_COMMIT: "adfffbe41b2cabcd51fff326ab045662265062bb"
jobs:
  build:
    needs: windows-launcher
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python runtime for reproducible checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Behavioral tests and source checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcrun swiftc -swift-version 5 BonsaiLab/BenchmarkCandidateRegistry.swift tools/build129_production_profile_policy_tests.swift -o "$RUNNER_TEMP/build129-profile-policy"
          "$RUNNER_TEMP/build129-profile-policy" | tee build/BUILD129_PROFILE_POLICY.txt
          xcrun swiftc -swift-version 5 BonsaiLab/InferenceProfile.swift tools/build129_profile_timing_tests.swift -o "$RUNNER_TEMP/build129-profile-timing"
          "$RUNNER_TEMP/build129-profile-timing" | tee -a build/BUILD129_PROFILE_POLICY.txt
          python3 -m unittest discover -s tools/tests -p "test_build129_profile_evidence.py" -v 2>&1 | tee -a build/BUILD129_PROFILE_POLICY.txt
          xcrun swiftc -swift-version 5 BonsaiLab/APIReasoningModePolicy.swift tools/build129_reasoning_effort_policy_tests.swift -o "$RUNNER_TEMP/build129-reasoning-policy"
          "$RUNNER_TEMP/build129-reasoning-policy" | tee build/BUILD129_POLICY.txt
          python3 tools/rc1252_api_usability_contract_tests.py 2>&1 | tee build/BUILD129_TESTS.txt
          python3 -m unittest discover -s tools/tests -p "test_build129_reasoning*.py" -v 2>&1 | tee -a build/BUILD129_TESTS.txt
          xcrun swiftc -swift-version 5 BonsaiLab/KVCachePolicy.swift BonsaiLab/BenchmarkCandidateRegistry.swift tools/build126_kv_policy_tests.swift -o "$RUNNER_TEMP/kv-policy"
          "$RUNNER_TEMP/kv-policy" | tee build/BUILD126_POLICY.txt
          xcrun swiftc -swift-version 5 BonsaiLab/BenchmarkInterruptionRecovery.swift BonsaiLab/BenchmarkCancellationEvidence.swift tools/build126_q8_interruption_recovery_tests.swift -o "$RUNNER_TEMP/q8-recovery"
          "$RUNNER_TEMP/q8-recovery" | tee -a build/BUILD126_POLICY.txt
          xcrun swiftc -swift-version 5 BonsaiLab/BenchmarkInterruptionRecovery.swift BonsaiLab/BenchmarkCancellationEvidence.swift tools/build128_q8_operator_abort_tests.swift -o "$RUNNER_TEMP/q8-operator-abort"
          "$RUNNER_TEMP/q8-operator-abort" | tee build/BUILD128_POLICY.txt
          python3 -m unittest discover -s tools/tests -p "test_build126*.py" -v 2>&1 | tee build/BUILD126_TESTS.txt
          python3 -m unittest discover -s tools/PTQ1_ONECLICK -p "test_q8_full_operator_abort.py" -v 2>&1 | tee build/BUILD128_TESTS.txt
          xcrun swiftc -swift-version 5 BonsaiLab/BenchmarkCandidateRegistry.swift tools/build127_q8_metal_b8_policy_tests.swift -o "$RUNNER_TEMP/build127-policy"
          "$RUNNER_TEMP/build127-policy" | tee build/BUILD127_POLICY.txt
          python3 -m unittest discover -s tools/tests -p "test_build127_q8_metal_b8.py" -v 2>&1 | tee build/BUILD127_TESTS.txt
          python3 tools/PTQ1_ONECLICK/q8_metal_b8.py --dry-run | tee -a build/BUILD127_TESTS.txt
          xcrun clang++ -std=c++17 -fsyntax-only -x objective-c++ -I BonsaiLab BonsaiLab/BenchmarkNativeBridge.mm
          python3 tools/PTQ1_ONECLICK/kv_baseline.py --dry-run
          python3 tools/documentation_consistency.py
          python3 -m unittest discover -s tools/tests -p test_documentation_consistency.py -v
          xcrun swiftc -swift-version 5 BonsaiLab/BenchmarkCandidateRegistry.swift tools/benchmark_session_policy_tests.swift -o "$RUNNER_TEMP/benchmark-policy"
          "$RUNNER_TEMP/benchmark-policy" | tee build/CI_TESTS.txt
          xcrun swiftc -swift-version 5 BonsaiLab/BenchmarkCandidateRegistry.swift BonsaiLab/BenchmarkSessionManager.swift tools/benchmark_manager_behavior_tests.swift -o "$RUNNER_TEMP/benchmark-manager"
          "$RUNNER_TEMP/benchmark-manager" | tee -a build/CI_TESTS.txt
          xcrun swiftc -frontend -parse BonsaiLab/APIReasoningModePolicy.swift BonsaiLab/BonsaiEngine.swift BonsaiLab/BenchmarkSessionManager.swift BonsaiLab/BenchmarkTelemetry.swift BonsaiLab/LocalOpenAIServer.swift
          python3 tools/rc126_build113_ptq1_tensorops_codec_tests.py 2>&1 | tee -a build/CI_TESTS.txt
          python3 -m unittest discover -s tools/PTQ1_ONECLICK -p 'test_*.py' -v 2>&1 | tee -a build/CI_TESTS.txt
          python3 -m unittest discover -s tools/tests -p "test_build124_oneclick.py" -v 2>&1 | tee -a build/CI_TESTS.txt
          python3 -m unittest discover -s tools/tests -p "test_build125_abc.py" -v 2>&1 | tee -a build/CI_TESTS.txt
          python3 -m unittest discover -s tools/tests -p "test_build125_assembly.py" -v 2>&1 | tee -a build/CI_TESTS.txt
          python3 -m py_compile tools/PTQ1_ONECLICK/ptq1_oneclick.py tools/PTQ1_ONECLICK/prefill_compare.py tools/PTQ1_ONECLICK/kv_baseline.py tools/PTQ1_ONECLICK/q8_metal_b8.py tools/PTQ1_ONECLICK/acknowledge_q8_interruption.py tools/PTQ1_ONECLICK/test_q8_full_operator_abort.py tools/rc126_build127_patch_prism_q8_metal_b8.py tools/package_ptq1_oneclick.py tools/package_build129_reasoning.py tools/BUILD129_REASONING_TESTKIT/build129_reasoning_api_smoke.py
          python3 -m unittest discover -s tools/tests -p "test_abba_measurement.py" -v 2>&1 | tee -a build/CI_TESTS.txt
          python3 -m unittest discover -s tools/tests -p "test_drift_detection.py" -v 2>&1 | tee -a build/CI_TESTS.txt
          python3 -m unittest discover -s tools/tests -p "test_measurement_thresholds.py" -v 2>&1 | tee -a build/CI_TESTS.txt
          python3 -m unittest discover -s tools/tests -p "test_build117_symbols.py" -v 2>&1 | tee -a build/CI_TESTS.txt
          python3 -m unittest discover -s tools/tests -p "test_build117_delivery_identity.py" -v 2>&1 | tee -a build/CI_TESTS.txt
          python3 -m unittest discover -s tools/tests -p "test_ipad_bundle_metadata.py" -v 2>&1 | tee -a build/CI_TESTS.txt
          python3 -m unittest discover -s tools/tests -p "test_build118_compare.py" -v 2>&1 | tee -a build/CI_TESTS.txt
          python3 -m unittest discover -s tools/tests -p "test_build119_recovery.py" -v 2>&1 | tee -a build/CI_TESTS.txt
          xcrun swiftc -swift-version 5 BonsaiLab/BenchmarkCandidateRegistry.swift BonsaiLab/BenchmarkInterruptionRecovery.swift BonsaiLab/BenchmarkCancellationEvidence.swift BonsaiLab/DiagnosticModels.swift BonsaiLab/DiagnosticStore.swift tools/build119_recovery_tests.swift -o "$RUNNER_TEMP/recovery-policy"
          "$RUNNER_TEMP/recovery-policy" | tee -a build/CI_TESTS.txt
          xcrun swiftc -swift-version 5 BonsaiLab/BenchmarkCandidateRegistry.swift BonsaiLab/BenchmarkInterruptionRecovery.swift BonsaiLab/BenchmarkCancellationEvidence.swift BonsaiLab/DiagnosticModels.swift BonsaiLab/DiagnosticStore.swift tools/build120_recovery_tests.swift -o "$RUNNER_TEMP/api-cancel-recovery"
          "$RUNNER_TEMP/api-cancel-recovery" | tee -a build/CI_TESTS.txt
          python3 -m unittest discover -s tools/tests -p "test_build120_recovery.py" -v 2>&1 | tee -a build/CI_TESTS.txt
          xcrun swiftc -swift-version 5 BonsaiLab/BenchmarkCandidateRegistry.swift tools/build118_policy_tests.swift -o "$RUNNER_TEMP/prefill-policy"
          "$RUNNER_TEMP/prefill-policy" | tee -a build/CI_TESTS.txt
          xcrun swiftc -swift-version 5 BonsaiLab/DiagnosticModels.swift BonsaiLab/DiagnosticStore.swift BonsaiLab/DiagnosticSessionJournal.swift tools/build117_diagnostics_tests.swift -o "$RUNNER_TEMP/diagnostics"
          "$RUNNER_TEMP/diagnostics" | tee -a build/CI_TESTS.txt
          xcrun clang++ -std=c++17 -fobjc-arc -framework Foundation -I BonsaiLab BonsaiLab/CrashCaptureBridge.mm tools/build117_crash_capture_tests.mm -o "$RUNNER_TEMP/crash-capture"
          "$RUNNER_TEMP/crash-capture" | tee -a build/CI_TESTS.txt
          xcrun swiftc -frontend -parse BonsaiLab/*.swift
          git diff --check

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Build patched Prism XCFramework
        shell: bash
        run: |
          set -euo pipefail
          PRISM_DIR="$RUNNER_TEMP/prism-build118"
          git clone --filter=blob:none https://github.com/PrismML-Eng/llama.cpp.git "$PRISM_DIR"
          git -C "$PRISM_DIR" checkout "$PRISM_COMMIT"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build83_patch_prism_kv_sharding.py" "$PRISM_DIR/src/llama-kv-cache.cpp"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build84_patch_prism_native_trace.py" "$PRISM_DIR/src/llama-kv-cache.cpp" "$PRISM_DIR/src/llama-context.cpp"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build85_patch_prism_scheduler_trace.py" "$PRISM_DIR/src/llama-context.cpp"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build86_patch_prism_crash_forensics.py" "$PRISM_DIR/src/llama-context.cpp" "$PRISM_DIR/ggml/src/ggml-backend.cpp"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build87_patch_prism_sched_context.py" "$PRISM_DIR/ggml/src/ggml-backend.cpp"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build88_patch_prism_mmap_recovery.py" "$PRISM_DIR/ggml/src/ggml-backend.cpp" "$PRISM_DIR/src/llama-context.cpp"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build89_patch_prism_compact_scheduler.py" "$PRISM_DIR/ggml/src/ggml-backend.cpp"
          grep -q 'BUILD89_COMPACT_ALLOC_SUCCESS' "$PRISM_DIR/ggml/src/ggml-backend.cpp"
            python3 "$GITHUB_WORKSPACE/tools/rc126_build113_patch_prism_m5_nax_pq2.py" "$PRISM_DIR"
            python3 "$GITHUB_WORKSPACE/tools/rc126_build113_patch_prism_ptq1_tensorops.py" "$PRISM_DIR"
            grep -q 'BONSAI_M5_NAX_PQ2_01' "$PRISM_DIR/ggml/src/ggml-metal/kernels/mul_mm.metal"
            grep -q 'BONSAI_M5_PTQ1_TENSOROPS_01' "$PRISM_DIR/ggml/src/ggml-metal/kernels/mul_mm.metal"
            grep -q 'kernel_mul_mm_ptq1_tensorops_0_f32' "$PRISM_DIR/ggml/src/ggml-metal/kernels/mul_mm.metal"
            grep -q 'ggml_metal_library_get_pipeline_mul_mm_ptq1_tensorops' "$PRISM_DIR/ggml/src/ggml-metal/ggml-metal-device.cpp"
            grep -q 'use_ptq1_tensorops' "$PRISM_DIR/ggml/src/ggml-metal/ggml-metal-ops.cpp"
            grep -q 'kernel_mul_mm_nax_pq2_0_f32' "$PRISM_DIR/ggml/src/ggml-metal/kernels/mul_mm.metal"
            grep -q 'ggml_metal_library_get_pipeline_mul_mm_nax_pq2' "$PRISM_DIR/ggml/src/ggml-metal/ggml-metal-device.cpp"
            grep -q 'use_pq2_nax' "$PRISM_DIR/ggml/src/ggml-metal/ggml-metal-ops.cpp"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build114_patch_prism_ptq1_benchmark.py" "$PRISM_DIR"
          BONSAI_PRISM_TEST_DIR="$PRISM_DIR" python3 -m unittest discover -s tools/tests -p test_ptq1_native_benchmark.py -v 2>&1 | tee -a build/CI_TESTS.txt
          python3 "$GITHUB_WORKSPACE/tools/rc126_build115_patch_scheduler_recovery.py" "$PRISM_DIR"
          BONSAI_PRISM_TEST_DIR="$PRISM_DIR" python3 -m unittest discover -s tools/tests -p test_scheduler_allocation_recovery.py -v 2>&1 | tee -a build/CI_TESTS.txt
          python3 "$GITHUB_WORKSPACE/tools/rc126_build116_patch_ipad_gpu_name.py" "$PRISM_DIR"
          BONSAI_PRISM_TEST_DIR="$PRISM_DIR" python3 -m unittest discover -s tools/tests -p test_ipad_benchmark_admission.py -v 2>&1 | tee -a build/CI_TESTS.txt
          python3 "$GITHUB_WORKSPACE/tools/rc126_build117_patch_profiling.py" "$PRISM_DIR"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build118_patch_cpu_prefill.py" "$PRISM_DIR"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build121_patch_cpu_timing.py" "$PRISM_DIR"
          BONSAI_PRISM_TEST_DIR="$PRISM_DIR" python3 -m unittest discover -s tools/tests -p test_build121_cpu_timing.py -v 2>&1 | tee -a build/CI_TESTS.txt
          python3 "$GITHUB_WORKSPACE/tools/rc126_build122_patch_sampling.py" "$PRISM_DIR"
          BONSAI_PRISM_TEST_DIR="$PRISM_DIR" python3 -m unittest discover -s tools/tests -p test_build122_sampling.py -v 2>&1 | tee -a build/CI_TESTS.txt
          python3 "$GITHUB_WORKSPACE/tools/rc126_build123_patch_unpack_reuse.py" "$PRISM_DIR"
          BONSAI_PRISM_TEST_DIR="$PRISM_DIR" python3 -m unittest discover -s tools/tests -p test_build123_unpack_reuse.py -v 2>&1 | tee -a build/CI_TESTS.txt
          BONSAI_REQUIRE_NEON=1 BONSAI_PRISM_TEST_DIR="$PRISM_DIR" python3 -m unittest discover -s tools/tests -p test_build118_cpu.py -v 2>&1 | tee -a build/CI_TESTS.txt
          BONSAI_PRISM_TEST_DIR="$PRISM_DIR" python3 -m unittest discover -s tools/tests -p test_build117_native_profile.py -v 2>&1 | tee -a build/CI_TESTS.txt
          python3 "$GITHUB_WORKSPACE/tools/rc126_build124_patch_sdot.py" "$PRISM_DIR"
          BONSAI_PRISM_TEST_DIR="$PRISM_DIR" python3 -m unittest discover -s tools/tests -p test_build124_sdot.py -v 2>&1 | tee -a build/CI_TESTS.txt
          python3 "$GITHUB_WORKSPACE/tools/rc126_build125_patch_sdot_pair.py" "$PRISM_DIR"
          BONSAI_PRISM_TEST_DIR="$PRISM_DIR" python3 -m unittest discover -s tools/tests -p test_build125_pair.py -v 2>&1 | tee -a build/CI_TESTS.txt
          BONSAI_PRISM_TEST_DIR="$PRISM_DIR" python3 -m unittest discover -s tools/tests -p test_build118_cpu.py -k actual_patched_native_strategy_control -v 2>&1 | tee -a build/CI_TESTS.txt
          python3 "$GITHUB_WORKSPACE/tools/rc126_build126_patch_kv_observation.py" "$PRISM_DIR"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build127_patch_prism_q8_metal_b8.py" "$PRISM_DIR"
          BONSAI_PRISM_TEST_DIR="$PRISM_DIR" python3 -m unittest discover -s tools/tests -p test_build127_q8_metal_b8.py -v 2>&1 | tee -a build/BUILD127_TESTS.txt
          grep -q 'kernel_mul_mv_ext_ptq1_0_f32_r1_8' "$PRISM_DIR/ggml/src/ggml-metal/kernels/mul_mv.metal"
          grep -q 'BonsaiNativeBenchmarkIncrement(12)' "$PRISM_DIR/ggml/src/ggml-metal/ggml-metal-ops.cpp"
          grep -q '| 256u' "$PRISM_DIR/ggml/src/ggml-metal/ggml-metal-device.m"
          grep -q 'BUILD89_META_USED' "$PRISM_DIR/ggml/src/ggml-backend.cpp"
          grep -q 'BUILD88_MMAP_SUCCESS' "$PRISM_DIR/ggml/src/ggml-backend.cpp"
          grep -q 'BUILD87_SPLIT_GGML_INIT_BEGIN' "$PRISM_DIR/ggml/src/ggml-backend.cpp"
          grep -q 'BUILD86_FUSED_PROBE_BEGIN' "$PRISM_DIR/src/llama-context.cpp"
          grep -q 'BUILD85_SCHED_ENTER' "$PRISM_DIR/src/llama-context.cpp"
          grep -q 'BUILD84_KV_ALLOC_BEGIN' "$PRISM_DIR/src/llama-kv-cache.cpp"
          grep -q 'BUILD83_METAL_KV_LAYER_SHARD' "$PRISM_DIR/src/llama-kv-cache.cpp"
          git -C "$PRISM_DIR" diff --check
          (
            cd "$PRISM_DIR"
            bash ./build-xcframework.sh ios-device
          )
          test -f "$PRISM_DIR/build-apple/llama.xcframework/ios-arm64/llama.framework/llama"
          xcrun llvm-objdump --disassemble --no-show-raw-insn "$PRISM_DIR/build-apple/llama.xcframework/ios-arm64/llama.framework/llama" > build/sdot-analysis/llama-disassembly.txt
          python3 tools/build125_inspect_assembly.py build/sdot-analysis/llama-disassembly.txt build/sdot-analysis/inspection.json
          mkdir -p Vendor
          ditto "$PRISM_DIR/build-apple/llama.xcframework" Vendor/llama.xcframework
          test -f Vendor/llama.xcframework/ios-arm64/llama.framework/llama

      - name: Embed exact source identity
        shell: bash
        run: |
          set -euo pipefail
          cat > BonsaiLab/BonsaiCertificationBuildIdentity.swift <<EOF
          enum BonsaiCertificationBuildIdentity {
              static let sourceGitSHA = "$GITHUB_SHA"
              static let workflowRunID = "$GITHUB_RUN_ID"
          }
          EOF

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/GeneratedInfo
          xcodegen generate
          test -d BonsaiLab.xcodeproj

      - name: Release Xcode build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project BonsaiLab.xcodeproj \
            -scheme BonsaiLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            GCC_GENERATE_DEBUGGING_SYMBOLS=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build | tee build/build.log

      - name: Verify Build129 IPA and native ABI
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error::Verification failed at line $LINENO: $BASH_COMMAND"' ERR
          set -x
          APP="$PWD/build/DerivedData/Build/Products/Release-iphoneos/BonsaiLab.app"
          test -d "$APP"
          test -f "$APP/BonsaiLab"
          python3 tools/validate_ipad_bundle.py "$APP/Info.plist" | tee -a build/CI_TESTS.txt
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Info.plist")" = "1.0.0"
          test "$(plutil -extract CFBundleVersion raw -o - "$APP/Info.plist")" = "$BUILD_NUMBER"
          FRAMEWORK="$APP/Frameworks/llama.framework/llama"
          test -f "$FRAMEWORK"
          nm -gU "$FRAMEWORK" > build/llama-symbols.txt
          grep -q '_mtmd_init_from_file' build/llama-symbols.txt
          grep -q '_mtmd_helper_eval_chunks' build/llama-symbols.txt
          grep -q '_llama_memory_seq_rm' build/llama-symbols.txt
          grep -q "$GITHUB_SHA" BonsaiLab/BonsaiCertificationBuildIdentity.swift

          for symbol in BonsaiNativeKVCacheType BonsaiNativeContextFailure BonsaiNativeBenchmarkConfigure BonsaiNativeBenchmarkCapabilities BonsaiNativeBenchmarkCounter BonsaiNativeBenchmarkBeginRequest BonsaiNativeBenchmarkObservation BonsaiNativeProfileCounter BonsaiNativeProfileReset BonsaiNativeProfileEnable BonsaiNativeCPUConfigure BonsaiNativeCPUCapabilities BonsaiNativeCPUCounter BonsaiNativeCPUBeginRequest BonsaiNativeCPUTimeCounter BonsaiNativeCPUTimeEnable BonsaiNativeCPUTimeReset BonsaiNativeCPUSamplingConfigure BonsaiNativeCPUSamplingCounter; do
            grep -q "_$symbol" build/llama-symbols.txt
          done
          strings "$FRAMEWORK" > build/llama-strings.txt
          for symbol in BonsaiNativeCPUReuseEnabled BonsaiNativeCPUReuseRow BonsaiNativeCPUSDOTPair BonsaiNativeCPUSDOTPairEnabled BonsaiNativeCPUSDOTPairObserve; do
            grep -q "_$symbol" build/llama-symbols.txt
          done
          grep -q 'kernel_mul_mv_ptq1_0_f32_bonsai_r5' build/llama-strings.txt
          grep -q 'kernel_mul_mv_ext_ptq1_0_f32_r1_8' build/llama-strings.txt
          grep -q 'BUILD115_SCHED_ALLOC_EXHAUSTED' build/llama-strings.txt
          grep -q 'kernel_mul_mm_ptq1_tensorops_0_f32' build/llama-strings.txt
          # App wrappers are directly linked and legitimately localized by ld.
          # Only the framework dlsym targets above require global exports.
          nm -U "$APP/BonsaiLab" > build/app-symbols.txt
          for symbol in BonsaiKVCacheType BonsaiContextFailure BonsaiBenchmarkConfigure BonsaiBenchmarkCapabilities BonsaiBenchmarkCounter BonsaiBenchmarkBeginRequest BonsaiBenchmarkObservation BonsaiProfileAvailable BonsaiProfileCounter BonsaiProfileReset BonsaiProfileEnable BonsaiCrashInstall BonsaiCrashRead BonsaiCPUAvailable BonsaiCPUCounter BonsaiCPUTimeAvailable BonsaiCPUTimeCounter BonsaiCPUTimeEnable BonsaiCPUTimeReset BonsaiCPUSamplingAvailable BonsaiCPUSamplingConfigure BonsaiCPUSamplingCounter; do
            grep -Eq "[[:space:]][tT][[:space:]]_$symbol$" build/app-symbols.txt
          done

      - name: Preserve UUID-matched App and native symbols
        shell: bash
        run: python3 tools/build117_symbols.py

      - name: Package one IPA and portable one-click kit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package_build129_reasoning.py
      - name: Upload SDOT assembly evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bonsai-Build129-Reasoning-Mode-Analysis
          path: |
            build/sdot-analysis/
            build/pair-analysis/
            build/CI_TESTS.txt
            build/BUILD126_POLICY.txt
            build/BUILD126_TESTS.txt
            build/BUILD127_POLICY.txt
            build/BUILD127_TESTS.txt
            build/BUILD128_POLICY.txt
            build/BUILD128_TESTS.txt
            build/BUILD129_POLICY.txt
            build/BUILD129_TESTS.txt
            build/llama-strings.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload combined building artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bonsai-Build129-Derived-Prefill-Diagnostics-IPA-and-TestKit
          path: |
            build/delivery/BONSAI_BUILD129_REASONING_MODE_CANDIDATE.zip
            build/delivery/BONSAI_BUILD129_REASONING_MODE_CANDIDATE.zip.sha256
            build/delivery/BONSAI_BUILD129_REASONING_TESTKIT.zip
            build/delivery/BONSAI_BUILD129_REASONING_TESTKIT.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload retained symbol artifact and UUID identity
        uses: actions/upload-artifact@v4
        with:
          name: Bonsai-Build129-Symbols
          path: |
            build/Bonsai-Build129-Symbols.zip
            build/Bonsai-Build129-Symbols.zip.sha256
            build/SYMBOL_IDENTITY.json
          if-no-files-found: error
          retention-days: 90

  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real CMD execution, paths and retained failure window
        run: python -m unittest discover -s tools/tests -p test_windows_launcher.py -v
