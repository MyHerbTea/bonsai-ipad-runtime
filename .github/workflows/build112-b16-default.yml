name: Bonsai Build112 B16 Default Candidate

on:
  push:
    branches:
      - chatgpt/build112-b16-default
      - lab/m5-nax-pq2-01
    paths-ignore:
      - 'tools/BUILD112_QUICK_TESTKIT/**'
      - 'tools/rc126_build113_m5_nax_pq2_quick_testkit_tests.py'
      - 'tools/build112_quick_testkit_contract_tests.py'
      - '.github/workflows/package-build112-quick-testkit.yml'
  workflow_dispatch:

concurrency:
  group: bonsai-build112-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_NUMBER: "112"
  PRISM_COMMIT: "adfffbe41b2cabcd51fff326ab045662265062bb"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: M5-NAX-PQ2-01 candidate contract
        if: github.ref_name == 'lab/m5-nax-pq2-01'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/rc126_build113_patch_prism_m5_nax_pq2.py
          python3 tools/rc126_build113_m5_nax_pq2_contract_tests.py
          xcrun swiftc -swift-version 5 \
            BonsaiLab/Build113MetalTensorPolicy.swift \
            tools/rc126_build113_metal_tensor_policy_tests.swift \
            -o "$RUNNER_TEMP/build113_metal_tensor_policy_tests"
          "$RUNNER_TEMP/build113_metal_tensor_policy_tests"
          git diff --check

      - name: Targeted Build112 behavior and policy tests
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -swift-version 5 \
            BonsaiLab/APIKeyAuthenticationPolicy.swift \
            tools/api_key_authentication_policy_tests.swift \
            -o "$RUNNER_TEMP/api_key_authentication_policy_tests"
          "$RUNNER_TEMP/api_key_authentication_policy_tests"
          xcrun swiftc -swift-version 5 \
            BonsaiLab/Build112APIStartupDiagnostics.swift \
            tools/build112_api_startup_diagnostics_tests.swift \
            -o "$RUNNER_TEMP/build112_api_startup_diagnostics_tests"
          "$RUNNER_TEMP/build112_api_startup_diagnostics_tests"
          xcrun swiftc -swift-version 5 \
            BonsaiLab/M5RuntimeGovernor.swift \
            tools/rc126_build106_policy_tests.swift \
            -o "$RUNNER_TEMP/build112_policy_tests"
          "$RUNNER_TEMP/build112_policy_tests"
          xcrun swiftc -frontend -parse BonsaiLab/M5RuntimeGovernor.swift
          xcrun swiftc -swift-version 5 \
            BonsaiLab/M5RuntimeGovernor.swift \
            tools/rc126_build113_candidate_shape_policy_tests.swift \
            -o "$RUNNER_TEMP/build113_candidate_shape_policy_tests"
          "$RUNNER_TEMP/build113_candidate_shape_policy_tests"
          git diff --check HEAD^ HEAD

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Build patched Prism XCFramework
        shell: bash
        run: |
          set -euo pipefail
          PRISM_DIR="/tmp/prism-build112"
          rm -rf "$PRISM_DIR" Vendor/llama.xcframework
          git clone --filter=blob:none https://github.com/PrismML-Eng/llama.cpp.git "$PRISM_DIR"
          git -C "$PRISM_DIR" checkout "$PRISM_COMMIT"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build83_patch_prism_kv_sharding.py" "$PRISM_DIR/src/llama-kv-cache.cpp"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build84_patch_prism_native_trace.py" "$PRISM_DIR/src/llama-kv-cache.cpp" "$PRISM_DIR/src/llama-context.cpp"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build85_patch_prism_scheduler_trace.py" "$PRISM_DIR/src/llama-context.cpp"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build86_patch_prism_crash_forensics.py" "$PRISM_DIR/src/llama-context.cpp" "$PRISM_DIR/ggml/src/ggml-backend.cpp"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build87_patch_prism_sched_context.py" "$PRISM_DIR/ggml/src/ggml-backend.cpp"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build88_patch_prism_mmap_recovery.py" "$PRISM_DIR/ggml/src/ggml-backend.cpp" "$PRISM_DIR/src/llama-context.cpp"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build89_patch_prism_compact_scheduler.py" "$PRISM_DIR/ggml/src/ggml-backend.cpp"
          grep -q 'BUILD89_COMPACT_ALLOC_SUCCESS' "$PRISM_DIR/ggml/src/ggml-backend.cpp"
          if [ "$GITHUB_REF_NAME" = "lab/m5-nax-pq2-01" ]; then
            python3 "$GITHUB_WORKSPACE/tools/rc126_build113_patch_prism_m5_nax_pq2.py" "$PRISM_DIR"
            grep -q 'BONSAI_M5_NAX_PQ2_01' "$PRISM_DIR/ggml/src/ggml-metal/kernels/mul_mm.metal"
            grep -q 'kernel_mul_mm_nax_pq2_0_f32' "$PRISM_DIR/ggml/src/ggml-metal/kernels/mul_mm.metal"
            grep -q 'ggml_metal_library_get_pipeline_mul_mm_nax_pq2' "$PRISM_DIR/ggml/src/ggml-metal/ggml-metal-device.cpp"
            grep -q 'use_pq2_nax' "$PRISM_DIR/ggml/src/ggml-metal/ggml-metal-ops.cpp"
          fi
          grep -q 'BUILD89_META_USED' "$PRISM_DIR/ggml/src/ggml-backend.cpp"
          grep -q 'BUILD88_MMAP_SUCCESS' "$PRISM_DIR/ggml/src/ggml-backend.cpp"
          grep -q 'BUILD87_SPLIT_GGML_INIT_BEGIN' "$PRISM_DIR/ggml/src/ggml-backend.cpp"
          grep -q 'BUILD86_FUSED_PROBE_BEGIN' "$PRISM_DIR/src/llama-context.cpp"
          grep -q 'BUILD85_SCHED_ENTER' "$PRISM_DIR/src/llama-context.cpp"
          grep -q 'BUILD84_KV_ALLOC_BEGIN' "$PRISM_DIR/src/llama-kv-cache.cpp"
          grep -q 'BUILD83_METAL_KV_LAYER_SHARD' "$PRISM_DIR/src/llama-kv-cache.cpp"
          git -C "$PRISM_DIR" diff --check
          (
            cd "$PRISM_DIR"
            bash ./build-xcframework.sh ios-device
          )
          test -f "$PRISM_DIR/build-apple/llama.xcframework/ios-arm64/llama.framework/llama"
          mkdir -p Vendor
          ditto "$PRISM_DIR/build-apple/llama.xcframework" Vendor/llama.xcframework
          test -f Vendor/llama.xcframework/ios-arm64/llama.framework/llama

      - name: Embed exact source identity
        shell: bash
        run: |
          set -euo pipefail
          cat > BonsaiLab/BonsaiCertificationBuildIdentity.swift <<EOF
          enum BonsaiCertificationBuildIdentity {
              static let sourceGitSHA = "$GITHUB_SHA"
              static let workflowRunID = "$GITHUB_RUN_ID"
          }
          EOF

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          test -d BonsaiLab.xcodeproj

      - name: Release Xcode build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project BonsaiLab.xcodeproj \
            -scheme BonsaiLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build | tee build.log

      - name: Verify Build112 IPA inputs
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/DerivedData/Build/Products/Release-iphoneos/BonsaiLab.app"
          test -d "$APP"
          test -f "$APP/BonsaiLab"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Info.plist")" = "1.0.0"
          test "$(plutil -extract CFBundleVersion raw -o - "$APP/Info.plist")" = "$BUILD_NUMBER"
          FRAMEWORK="$APP/Frameworks/llama.framework/llama"
          test -f "$FRAMEWORK"
          nm -gU "$FRAMEWORK" > build/llama-symbols.txt
          grep -q '_mtmd_init_from_file' build/llama-symbols.txt
          grep -q '_mtmd_helper_eval_chunks' build/llama-symbols.txt
          grep -q '_llama_memory_seq_rm' build/llama-symbols.txt
          grep -q "$GITHUB_SHA" BonsaiLab/BonsaiCertificationBuildIdentity.swift

      - name: Verify M5-NAX-PQ2 final framework binary
        if: github.ref_name == 'lab/m5-nax-pq2-01'
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/DerivedData/Build/Products/Release-iphoneos/BonsaiLab.app"
          bash tools/rc126_build113_verify_m5_nax_pq2_binary.sh "$APP/Frameworks/llama.framework/llama" build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/DerivedData/Build/Products/Release-iphoneos/BonsaiLab.app"
          if [ "$GITHUB_REF_NAME" = "lab/m5-nax-pq2-01" ]; then
            IPA_NAME="BonsaiLab-v1-RC1.26-build112-ptq1-auth-startup-unsigned.ipa"
          else
            IPA_NAME="BonsaiLab-v1-RC1.26-build112-b16-default-unsigned.ipa"
          fi
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          ditto "$APP" build/ipa/Payload/BonsaiLab.app
          cat > build/BUILD_INFO.txt <<INFO
          Bonsai iPad Lab v1 RC1.26 Build112 PTQ1_0 Auth/Startup Candidate
          Status: source/build candidate; M5 device validation pending.
          Primary model target: Ternary-Bonsai-2-27B-PTQ1_0.gguf on M5 iPad Pro 12GB.
          Runtime: existing Build112 context and B16/B8/SAFE4 safety policy retained; no batch/ubatch defaults changed.
          API Key auth: persistent setting defaults on; /health exposes only auth_required; disabled mode permits local development without a key.
          Startup evidence: last successful stage, last failed stage, actual error and previous incomplete stage persist across launches.
          NAX-PQ2-01 remains experimental and model-gated; PTQ1_0 forces the safe Tensor-disabled backend even if CANDIDATE was selected.
          Candidate kernel: kernel_mul_mm_nax_pq2_0_f32; actual route still requires the kernel's GGML weight-type and matrix-shape checks.
          Candidate binary: static kernel-source and host-dispatch checks recorded in M5_NAX_PQ2_BINARY_VERIFICATION.txt.
          Runtime Metal compilation, real-device crash-free startup, numerical correctness and performance remain unverified pending M5 device evidence.
          Prism source: $PRISM_COMMIT; inherited patches 83 through 89.
          Experimental branch: $GITHUB_REF_NAME
          Commit: $GITHUB_SHA
          Workflow run: $GITHUB_RUN_ID.
          Commit: $GITHUB_SHA
          Workflow run: $GITHUB_RUN_ID
          INFO
          (cd build/ipa && zip -qry "../$IPA_NAME" Payload)
          (cd build && shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256")
          cp build/BUILD_INFO.txt build/"$IPA_NAME".BUILD_INFO.txt

      - name: Upload Build112 PTQ1 Auth/Startup IPA artifact
        if: github.ref_name == 'lab/m5-nax-pq2-01'
        uses: actions/upload-artifact@v4
        with:
          name: BonsaiLab-iPad-v1-RC1.26-Build112-PTQ1-Auth-Startup
          path: |
            build/BonsaiLab-v1-RC1.26-build112-ptq1-auth-startup-unsigned.ipa
            build/BonsaiLab-v1-RC1.26-build112-ptq1-auth-startup-unsigned.ipa.sha256
            build/BUILD_INFO.txt
            build/M5_NAX_PQ2_BINARY_VERIFICATION.txt
            build/build.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build112 B16 Default artifact
        if: github.ref_name == 'chatgpt/build112-b16-default'
        uses: actions/upload-artifact@v4
        with:
          name: BonsaiLab-iPad-v1-RC1.26-Build112-B16-Default
          path: |
            build/BonsaiLab-v1-RC1.26-build112-b16-default-unsigned.ipa
            build/BonsaiLab-v1-RC1.26-build112-b16-default-unsigned.ipa.sha256
            build/BUILD_INFO.txt
            build/build.log
          if-no-files-found: error
          retention-days: 14
